services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  # Instantiated explicitly to bound its parameter cache; the implicit default
  # caches every processed value without limit and can exhaust the heap.
  # cacheAll false: only parameters actually retrieved get cached, so
  # high-rate realtime-only telemetry just flows through uncached.
  - class: org.yamcs.parameter.ParameterRetrievalService
    args:
      parameterCache:
        cacheAll: false
        maxNumEntries: 32
        duration: 60
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.ProcessRunner
    args:
      command: ["fprime-yamcs-events"]
      restart: "always"
      logLevel: INFO
  # Environment variables to set before starting YAMCS
  # FPRIME_UPLINK_CHUNK_SIZE - Bytes per uplink data packet
  # Set by: export FPRIME_UPLINK_CHUNK_SIZE=1024
  # FPRIME_DOWNLINK_DIR - Directory to mirror downloaded files
  # Set by: export FPRIME_DOWNLINK_DIR=/custom/downlink/path

  # Reassembles Fw::FilePacket downlinks (APID 3) into the fprimeFilesIn bucket.
  - class: gov.nasa.jpl.fprime.yamcs.filetransfer.FprimeFilePacketService
    args:
      inStream: tm_realtime
      bucket: fprimeFilesIn
      fileApid: 3
      downloadTimeoutMs: 8000
      uplinkChunkSize: ${FPRIME_UPLINK_CHUNK_SIZE:512}
      # Optional local mirror of downlinked files; leave unset (off) unless
      # pointed at a directory owned by the YAMCS user — world-writable
      # locations like /tmp can be symlink-attacked before service start.
      downlinkMirrorDir: ${FPRIME_DOWNLINK_DIR:}

  # Class-1 (unacknowledged) CFDP file transfer. Enable when the flight
  # software carries CFDP PDUs in space packets on a dedicated APID. The
  # uplinkLink may be a TC frame virtual channel (as below) or a raw
  # space-packet link such as org.yamcs.tctm.UdpTcDataLink. If a raw link is
  # used, attach it to a dedicated tc stream (e.g. tc_cfdp declared under
  # streamConfig) — a second link on tc_realtime would steal MDB commands
  # from the primary TC link.
  #- class: gov.nasa.jpl.fprime.yamcs.filetransfer.CfdpFileTransferService
  #  args:
  #    inStream: tm_realtime
  #    bucket: cfdpFiles
  #    cfdpApid: 16   # pick an APID unused by your deployment's ComCfg assignments
  #    localEntityId: 1
  #    remoteEntityId: 2
  #    uplinkLink: UDP_TC_OUT.vc1
  #    uplinkChunkSize: ${FPRIME_UPLINK_CHUNK_SIZE:512}
  #    downlinkMirrorDir: ${FPRIME_DOWNLINK_DIR:}

dataLinks:
  - name: UDP_TM_IN
    class: org.yamcs.tctm.ccsds.UdpTmFrameLink
    port: 50000
    frameType: "TM"
    spacecraftId: 68
    frameLength: 1024
    errorDetection: CRC16
    virtualChannels:
      - vcId: 1
        ocfPresent: false
        service: "PACKET"
        maxPacketLength: 1024
        packetPreprocessorClassName: gov.nasa.jpl.fprime.yamcs.tctm.FprimePacketPreprocessor
        stream: "tm_realtime"

  - name: UDP_TC_OUT
    class: org.yamcs.tctm.ccsds.UdpTcFrameLink
    host: localhost
    port: 50001
    spacecraftId: 68
    maxFrameLength: 1024
    errorDetection: CRC16
    virtualChannels:
      - vcId: 1
        ocfPresent: false
        service: "PACKET"
        priority: 1
        commandPostprocessorClassName: gov.nasa.jpl.fprime.yamcs.tctm.FprimeCommandPostprocessor
        stream: "tc_realtime"
        useCop1: false

mdb:
  # Configuration of the active loaders
  # Valid loaders are: sheet, xtce or fully qualified name of the class
  - type: xtce
    args:
      file: mdb/fprime.xtce.xml

# Configuration for streams created at server startup
streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
