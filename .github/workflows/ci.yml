name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version consistency
        run: python scripts/check-versions.py
      - name: Build plugin jar and collect YAMCS jars
        run: ./scripts/build-jars.sh
      - name: Upgrade Python Build Tools
        run: pip install -U build wheel
      - name: Build wheels
        run: |
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist packages/bundle
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/
      - name: Install
        run: pip install dist/*.whl pytest
      - name: Run unit tests
        run: pytest tests/

  # The yamcs GDS data-transport plugin registers through the fprime_gds entry point; exercise it against
  # the fprime-gds development branch, which carries the data_transport plugin category (nasa/fprime#5546).
  unit-tests-gds-devel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/
      - name: Install
        run: |
          pip install dist/*.whl pytest
          pip install --upgrade "fprime-gds @ git+https://github.com/nasa/fprime-gds.git@devel"
      - name: Run unit tests
        run: pytest tests/

  # Prove a pip-only install works: no Maven and no system Java in the container (the Java
  # runtime comes from the fprime-jre dependency on PyPI)
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/
      - name: Verify Maven and Java are absent
        run: |
          ! command -v mvn
          ! command -v java
      - name: Install wheels
        run: pip install dist/*.whl
      - name: Run smoke test
        run: python scripts/smoke-test.py
