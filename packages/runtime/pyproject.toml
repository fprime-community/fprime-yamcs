[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-yamcs-runtime"
# First three numbers track the Temurin JDK version used to build the runtime image;
# the fourth is the repackaging number.
version = "21.0.12.0"
description = "A jlink-trimmed Java runtime for fprime-yamcs, built from Eclipse Temurin"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Michael Starch", email = "LeStarch@googlemail.com"}
]
maintainers = [
    {name = "Michael Starch", email = "LeStarch@googlemail.com"}
]
keywords = ["fprime", "yamcs", "java", "jre", "jvm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fprime-community/fprime-yamcs"
Repository = "https://github.com/fprime-community/fprime-yamcs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fprime_yamcs_runtime = ["java-runtime/**/*", "java-runtime/**/.*"]
